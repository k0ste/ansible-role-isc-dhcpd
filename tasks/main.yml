---
- name: "dhcpd | Load validation scenarios"
  ansible.builtin.include_tasks:
    file: "scenarios/validation/main.yml"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_scenario', default='') in
      ['validation', 'both']"
- name: "dhcpd | Load deploy scenarios"
  ansible.builtin.include_tasks:
    file: "scenarios/deploy/main.yml"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_scenario', default='deploy') in
      ['deploy', 'both']"
