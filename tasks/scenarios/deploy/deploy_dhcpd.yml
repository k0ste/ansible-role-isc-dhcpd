---
- name: "dhcpd | Deploy dhcpd.conf"
  ansible.builtin.template:
    src: "dhcpd.conf.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'dhcpd_conf_dest') + '/' +
      lookup('ansible.builtin.vars', 'dhcpd_dhcpd_conf') }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "dhcpd -t -cf %s"
  notify: "Restart dhcpd"
- name: "dhcpd | Enable dhcpd"
  ansible.builtin.service:
    name: "{{ lookup('ansible.builtin.vars', 'dhcpd_dhcpd_service') }}"
    state: "started"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_service_enable',
      default='') == 'true'"
