---
- name: "dhcpd | Assert that fixed address is ip address"
  ansible.builtin.assert:
    that:
      - "(host['fixed_address'] |
        ansible.utils.ipaddr('host')) is ansible.utils.ip"
    fail_msg: "{{ '[' ~ host['name'] ~ '] is not ipaddr: ' ~
      host['fixed_address'] }}"
    success_msg: "{{ '[' ~ host['name'] ~ '] is ipaddr: ' ~
      host['fixed_address'] }}"
    quiet: "true"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_groups') |
    community.general.json_query(\"[?name=='\" ~ lookup('ansible.builtin.vars',
    'dhcpd_group') ~ \"'].hosts\") | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "host"
    label: "{{ 'Validate DHCP host Fixed address: ' ~ host['name'] }}"
  when:
    - "host['fixed_address'] is defined"
    - "host['fixed_address'] not in ['', [], '[]', None]"
- name: "dhcpd | Assert that broadcast address is ip address"
  ansible.builtin.assert:
    that:
      - "(host['broadcast_address'] |
        ansible.utils.ipaddr('broadcast')) is ansible.utils.ip()"
    fail_msg: "{{ '[' ~ host['name'] ~ '] is not broadcast ipaddr: ' ~
      host['broadcast_address'] }}"
    success_msg: "{{ '[' ~ host['name'] ~ '] is broadcast ipaddr: ' ~
      host['broadcast_address'] }}"
    quiet: "true"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_groups') |
    community.general.json_query(\"[?name=='\" ~ lookup('ansible.builtin.vars',
    'dhcpd_group') ~ \"'].hosts\") | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "host"
    label: "{{ 'Validate DHCP host Broadcast address: ' ~ host['name'] }}"
  when:
    - "host['broadcast_address'] is defined"
    - "host['broadcast_address'] not in ['', [], '[]', None]"
- name: "dhcpd | Assert that mac address is hardware address in linux format"
  ansible.builtin.assert:
    that:
      - "(host['mac_address'] |
        ansible.utils.hwaddr('linux')) is ansible.utils.mac()"
    fail_msg: "{{ '[' ~ host['name'] ~ '] is not maddr: ' ~
      host['mac_address'] }}"
    success_msg: "{{ '[' ~ host['name'] ~ '] is maddr: ' ~
      host['mac_address'] }}"
    quiet: "true"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_groups') |
    community.general.json_query(\"[?name=='\" ~ lookup('ansible.builtin.vars',
    'dhcpd_group') ~ \"'].hosts\") | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "host"
    label: "{{ 'Validate DHCP host MAC address: ' ~ host['name'] }}"
  when:
    - "host['mac_address'] is defined"
    - "host['mac_address'] not in ['', [], '[]', None]"
