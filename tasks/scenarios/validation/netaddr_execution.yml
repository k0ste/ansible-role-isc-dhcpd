---
- name: "dhcpd | Start 'dhcpd_groups' validation"
  ansible.builtin.include_tasks:
    file: "netaddr_validation.yml"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_group_names') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "dhcpd_group"
    label: "{{ 'Validate DHCP group: ' ~ dhcpd_group }}"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_group_names', default='')
      not in ['', [], '[]', None]"
- name: "dhcpd | Start 'dhcpd_hosts' validation"
  ansible.builtin.include_tasks:
    file: "netaddr_validation_simple.yml"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_hosts') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "host"
    label: "{{ 'Validate DHCP host: ' ~ host['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_hosts', default='')
      not in ['', [], '[]', None]"
- name: "dhcpd | Start 'dhcpd_global_hosts' validation"
  ansible.builtin.include_tasks:
    file: "netaddr_validation_simple.yml"
  loop: "{{ lookup('ansible.builtin.vars', 'dhcpd_global_hosts') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "host"
    label: "{{ 'Validate DHCP host: ' ~ host['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_global_hosts', default='')
      not in ['', [], '[]', None]"
