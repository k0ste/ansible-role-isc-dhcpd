---
- name: "dhcpd | Restart apparmor"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['dhcpd_apparmor_service'] }}"
    state: "restarted"
  listen: "Restart apparmor"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_apparmor_restart',
      default='') == 'true'"
- name: "dhcpd | Restart dhcpd"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['dhcpd_dhcpd_service'] }}"
    state: "restarted"
  listen: "Restart dhcpd"
  when:
    - "lookup('ansible.builtin.vars', 'dhcpd_service_restart',
      default='') == 'true'"
